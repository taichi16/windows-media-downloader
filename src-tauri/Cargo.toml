[package]
name = "windows-media-downloader"
version = "1.0.0"
description = "安全、可攜的 Windows 影音下載工具"
authors = ["Y.J. Wang"]
edition = "2021"
rust-version = "1.78"

[lib]
name = "windows_media_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-dialog = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "process", "io-util", "sync", "time"] }
url = "2.5"
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
] }
